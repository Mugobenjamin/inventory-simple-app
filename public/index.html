<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Stock Dashboard</p>
          <h1>Inventory Manager</h1>
        </div>
        <div class="summary" id="summary"></div>
      </header>

      <main class="layout">
        <section class="panel">
          <h2>Add Product</h2>
          <form id="productForm" class="product-form">
            <div class="field-group">
              <label for="name">Product name</label>
              <input id="name" name="name" placeholder="Example: Rice 25kg" required />
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="sku">SKU</label>
                <input id="sku" name="sku" placeholder="SKU-001" />
              </div>
              <div class="field-group">
                <label for="total_stock">Total stock</label>
                <input id="total_stock" name="total_stock" type="number" min="0" value="0" />
              </div>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="retail_intake">Retail intake</label>
                <input id="retail_intake" name="retail_intake" type="number" min="0" value="0" />
              </div>
              <div class="field-group">
                <label for="wholesale_intake">Wholesale intake</label>
                <input id="wholesale_intake" name="wholesale_intake" type="number" min="0" value="0" />
              </div>
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="retail_price">Retail price</label>
                <input id="retail_price" name="retail_price" type="number" min="0" step="0.01" value="0" />
              </div>
              <div class="field-group">
                <label for="wholesale_price">Wholesale price</label>
                <input id="wholesale_price" name="wholesale_price" type="number" min="0" step="0.01" value="0" />
              </div>
            </div>

            <button type="submit" class="primary-btn">Save Product</button>
          </form>
        </section>

        <section class="panel wide-panel">
          <div class="section-head">
            <h2>Products</h2>
          </div>
          <div id="productList" class="product-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
