<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#eefaf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#113" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Container -->
  <rect x="40" y="30" width="1120" height="720" rx="18" fill="none" stroke-opacity="0" />

  <!-- Topbar -->
  <g transform="translate(80,60)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2958d8" font-weight="700">STOCK DASHBOARD</text>
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#102542" font-weight="700">Inventory Manager</text>

    <!-- Summary boxes -->
    <g transform="translate(680,0)">
      <g transform="translate(0,0)">
        <rect x="0" y="-6" width="360" height="72" rx="12" fill="#ffffff" stroke="#dfe9f5" filter="url(#cardShadow)" />
        <g transform="translate(16,8)" font-family="Arial, Helvetica, sans-serif">
          <text x="0" y="18" font-size="12" fill="#5d728a">Products</text>
          <text x="0" y="42" font-size="22" fill="#102542" font-weight="700">8</text>
          <g transform="translate(120,0)">
            <text x="0" y="18" font-size="12" fill="#5d728a">Total stock</text>
            <text x="0" y="42" font-size="22" fill="#102542" font-weight="700">1,254</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Layout panels -->
  <g transform="translate(80,140)">
    <!-- Left panel (form) -->
    <rect x="0" y="0" width="420" height="540" rx="18" fill="#ffffff" stroke="#dfe9f5" filter="url(#cardShadow)" />
    <text x="20" y="36" font-family="Arial" font-size="20" fill="#102542" font-weight="700">Add Product</text>

    <!-- form fields mock -->
    <g transform="translate(20,66)" font-family="Arial">
      <text x="0" y="0" font-size="12" fill="#5d728a">Product name</text>
      <rect x="0" y="8" width="380" height="38" rx="8" fill="#fbfdff" stroke="#dfe9f5" />

      <g transform="translate(0,64)">
        <text x="0" y="0" font-size="12" fill="#5d728a">SKU</text>
        <rect x="0" y="8" width="170" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />

        <text x="200" y="0" font-size="12" fill="#5d728a">Total stock</text>
        <rect x="200" y="8" width="180" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />
      </g>

      <g transform="translate(0,140)">
        <text x="0" y="0" font-size="12" fill="#5d728a">Retail intake</text>
        <rect x="0" y="8" width="170" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />

        <text x="200" y="0" font-size="12" fill="#5d728a">Wholesale intake</text>
        <rect x="200" y="8" width="180" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />
      </g>

      <g transform="translate(0,210)">
        <text x="0" y="0" font-size="12" fill="#5d728a">Retail price</text>
        <rect x="0" y="8" width="170" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />

        <text x="200" y="0" font-size="12" fill="#5d728a">Wholesale price</text>
        <rect x="200" y="8" width="180" height="36" rx="8" fill="#fbfdff" stroke="#dfe9f5" />
      </g>

      <g transform="translate(0,300)">
        <rect x="0" y="0" width="380" height="44" rx="10" fill="#2958d8" />
        <text x="190" y="30" font-family="Arial" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">Save Product</text>
      </g>
    </g>

    <!-- Right panel (products) -->
    <rect x="460" y="0" width="640" height="540" rx="18" fill="#ffffff" stroke="#dfe9f5" filter="url(#cardShadow)" />
    <text x="480" y="36" font-family="Arial" font-size="20" fill="#102542" font-weight="700">Products</text>

    <!-- Product cards -->
    <g transform="translate(480,66)">
      <!-- Card 1 -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="600" height="120" rx="12" fill="#fbfdff" stroke="#dfe9f5" />
        <text x="16" y="28" font-family="Arial" font-size="16" fill="#102542" font-weight="700">Rice 25kg</text>
        <text x="16" y="48" font-family="Arial" font-size="12" fill="#5d728a">SKU: RICE-025</text>

        <!-- stock boxes -->
        <g transform="translate(16,64)">
          <rect x="0" y="0" width="170" height="40" rx="8" fill="#eef5ff" stroke="#dfe9f5" />
          <text x="12" y="18" font-size="11" fill="#5d728a">Total stock</text>
          <text x="12" y="34" font-size="16" fill="#102542" font-weight="700">120</text>

          <rect x="190" y="0" width="170" height="40" rx="8" fill="#eefaf6" stroke="#dfe9f5" />
          <text x="202" y="18" font-size="11" fill="#5d728a">Retail intake</text>
          <text x="202" y="34" font-size="16" fill="#102542" font-weight="700">40</text>

          <rect x="380" y="0" width="170" height="40" rx="8" fill="#fff8f5" stroke="#dfe9f5" />
          <text x="392" y="18" font-size="11" fill="#5d728a">Wholesale intake</text>
          <text x="392" y="34" font-size="16" fill="#102542" font-weight="700">80</text>
        </g>

        <!-- action buttons -->
        <g transform="translate(420,24)">
          <rect x="0" y="0" width="64" height="28" rx="8" fill="#0a9d72" />
          <text x="32" y="19" font-size="12" fill="#fff" text-anchor="middle">+ stock</text>
          <rect x="74" y="0" width="84" height="28" rx="8" fill="#d58b17" />
          <text x="116" y="19" font-size="12" fill="#fff" text-anchor="middle">+ retail</text>
          <rect x="164" y="0" width="100" height="28" rx="8" fill="#cd3f3f" />
          <text x="214" y="19" font-size="12" fill="#fff" text-anchor="middle">+ wholesale</text>
        </g>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0,140)">
        <rect x="0" y="0" width="600" height="120" rx="12" fill="#fbfdff" stroke="#dfe9f5" />
        <text x="16" y="28" font-family="Arial" font-size="16" fill="#102542" font-weight="700">Cooking Oil 5L</text>
        <text x="16" y="48" font-family="Arial" font-size="12" fill="#5d728a">SKU: OIL-005</text>

        <!-- stock boxes -->
        <g transform="translate(16,64)">
          <rect x="0" y="0" width="170" height="40" rx="8" fill="#eef5ff" stroke="#dfe9f5" />
          <text x="12" y="18" font-size="11" fill="#5d728a">Total stock</text>
          <text x="12" y="34" font-size="16" fill="#102542" font-weight="700">60</text>

          <rect x="190" y="0" width="170" height="40" rx="8" fill="#eefaf6" stroke="#dfe9f5" />
          <text x="202" y="18" font-size="11" fill="#5d728a">Retail intake</text>
          <text x="202" y="34" font-size="16" fill="#102542" font-weight="700">20</text>

          <rect x="380" y="0" width="170" height="40" rx="8" fill="#fff8f5" stroke="#dfe9f5" />
          <text x="392" y="18" font-size="11" fill="#5d728a">Wholesale intake</text>
          <text x="392" y="34" font-size="16" fill="#102542" font-weight="700">40</text>
        </g>

        <!-- action buttons -->
        <g transform="translate(420,24)">
          <rect x="0" y="0" width="64" height="28" rx="8" fill="#0a9d72" />
          <text x="32" y="19" font-size="12" fill="#fff" text-anchor="middle">+ stock</text>
          <rect x="74" y="0" width="84" height="28" rx="8" fill="#d58b17" />
          <text x="116" y="19" font-size="12" fill="#fff" text-anchor="middle">+ retail</text>
          <rect x="164" y="0" width="100" height="28" rx="8" fill="#cd3f3f" />
          <text x="214" y="19" font-size="12" fill="#fff" text-anchor="middle">+ wholesale</text>
        </g>
      </g>

    </g>
  </g>

  <!-- Footer note -->
  <text x="80" y="740" font-family="Arial" font-size="12" fill="#5d728a">This is a generated UI preview (SVG). For the live interactive UI, run the app locally or visit the hosted demo if available.</text>
</svg>
